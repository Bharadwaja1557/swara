<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10101c"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0"/>
      <stop offset="60%" stop-color="#c8a96e" stop-opacity="0"/>
      <stop offset="78%" stop-color="#c8a96e" stop-opacity="0.35"/>
      <stop offset="88%" stop-color="#c8a96e" stop-opacity="0.55"/>
      <stop offset="95%" stop-color="#e8c98e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="44%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sq"><rect width="400" height="400"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" clip-path="url(#sq)"/>
  <!-- Distant glow haze -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#c8a96e" stroke-width="60" opacity="0.06" filter="url(#soft)"/>
  <!-- Corona ring -->
  <circle cx="200" cy="200" r="155" fill="url(#corona)" filter="url(#glow)"/>
  <!-- Subtle outer ring hairlines -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#c8a96e" stroke-width="0.8" opacity="0.25"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#c8a96e" stroke-width="0.4" opacity="0.15"/>
  <!-- Moon disc (slightly offset for eclipse effect) -->
  <circle cx="193" cy="193" r="128" fill="url(#disc)"/>
  <!-- Rim light — thin bright arc on the left edge -->
  <path d="M 86 148 A 128 128 0 0 0 86 248" fill="none" stroke="#c8a96e" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
  <path d="M 90 162 A 118 118 0 0 0 90 234" fill="none" stroke="#c8a96e" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
  <!-- Star field -->
  <circle cx="48"  cy="65"  r="1.2" fill="white" opacity="0.7"/>
  <circle cx="110" cy="42"  r="0.9" fill="white" opacity="0.5"/>
  <circle cx="298" cy="55"  r="1.1" fill="white" opacity="0.65"/>
  <circle cx="355" cy="88"  r="0.8" fill="white" opacity="0.45"/>
  <circle cx="372" cy="310" r="1"   fill="white" opacity="0.55"/>
  <circle cx="330" cy="362" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="62"  cy="340" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="38"  cy="280" r="1"   fill="white" opacity="0.4"/>
</svg>
