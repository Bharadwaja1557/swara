<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a4a6e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1a6a8e" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#1a6a8e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a4a6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c8a96e" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#c8a96e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3a5a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0f3a5a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0f3a5a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f3a5a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Wave stack — 18 layered sine-like arcs, spacing tightens toward center -->
  <!-- Outer cool waves -->
  <path d="M-20 60  Q80 30  200 60  Q320 90  420 60"  fill="none" stroke="url(#w1)" stroke-width="1.4" opacity="0.35"/>
  <path d="M-20 85  Q80 55  200 85  Q320 115 420 85"  fill="none" stroke="url(#w1)" stroke-width="1.4" opacity="0.38"/>
  <path d="M-20 110 Q80 80  200 110 Q320 140 420 110" fill="none" stroke="url(#w1)" stroke-width="1.5" opacity="0.42"/>
  <path d="M-20 135 Q80 105 200 135 Q320 165 420 135" fill="none" stroke="url(#w1)" stroke-width="1.5" opacity="0.48"/>
  <path d="M-20 158 Q80 128 200 158 Q320 188 420 158" fill="none" stroke="url(#w1)" stroke-width="1.6" opacity="0.55"/>
  <!-- Accent transition waves -->
  <path d="M-20 178 Q80 148 200 178 Q320 208 420 178" fill="none" stroke="url(#w2)" stroke-width="1.8" opacity="0.5"/>
  <path d="M-20 196 Q80 166 200 196 Q320 226 420 196" fill="none" stroke="url(#w2)" stroke-width="2.2" opacity="0.65"/>
  <!-- Core accent waves — thicker, brighter -->
  <path d="M-20 212 Q80 182 200 212 Q320 242 420 212" fill="none" stroke="#c8a96e" stroke-width="2.8" opacity="0.75"/>
  <path d="M-20 226 Q80 196 200 226 Q320 256 420 226" fill="none" stroke="#c8a96e" stroke-width="3.2" opacity="0.8"/>
  <path d="M-20 240 Q80 210 200 240 Q320 270 420 240" fill="none" stroke="#c8a96e" stroke-width="2.8" opacity="0.75"/>
  <!-- Receding accent -->
  <path d="M-20 256 Q80 226 200 256 Q320 286 420 256" fill="none" stroke="url(#w2)" stroke-width="2" opacity="0.6"/>
  <path d="M-20 272 Q80 242 200 272 Q320 302 420 272" fill="none" stroke="url(#w2)" stroke-width="1.8" opacity="0.48"/>
  <!-- Lower cool waves -->
  <path d="M-20 290 Q80 260 200 290 Q320 320 420 290" fill="none" stroke="url(#w3)" stroke-width="1.6" opacity="0.5"/>
  <path d="M-20 310 Q80 280 200 310 Q320 340 420 310" fill="none" stroke="url(#w3)" stroke-width="1.5" opacity="0.42"/>
  <path d="M-20 330 Q80 300 200 330 Q320 360 420 330" fill="none" stroke="url(#w3)" stroke-width="1.4" opacity="0.35"/>
  <path d="M-20 350 Q80 320 200 350 Q320 380 420 350" fill="none" stroke="url(#w3)" stroke-width="1.3" opacity="0.28"/>
  <path d="M-20 370 Q80 340 200 370 Q320 400 420 370" fill="none" stroke="url(#w3)" stroke-width="1.2" opacity="0.2"/>
</svg>
