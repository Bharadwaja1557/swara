<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#0d0c16"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a07840" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a07840" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c8a96e" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#c8a96e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Grid lines — horizontal -->
  <line x1="40" y1="100" x2="360" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="40" y1="150" x2="360" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="40" y1="200" x2="360" y2="200" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="40" y1="250" x2="360" y2="250" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="40" y1="300" x2="360" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <!-- Equaliser bars — primary (tall accent) -->
  <rect x="50"  y="260" width="22" height="80"  rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="82"  y="185" width="22" height="155" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="114" y="230" width="22" height="110" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="146" y="140" width="22" height="200" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="178" y="100" width="22" height="240" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="210" y="155" width="22" height="185" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="242" y="200" width="22" height="140" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="274" y="170" width="22" height="170" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="306" y="220" width="22" height="120" rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="338" y="270" width="22" height="70"  rx="3" fill="url(#bar)" filter="url(#glow)"/>
  <!-- Mirror bars — dim below baseline -->
  <rect x="50"  y="342" width="22" height="26" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="82"  y="342" width="22" height="38" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="114" y="342" width="22" height="30" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="146" y="342" width="22" height="44" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="178" y="342" width="22" height="52" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="210" y="342" width="22" height="40" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="242" y="342" width="22" height="34" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="274" y="342" width="22" height="38" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="306" y="342" width="22" height="28" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <rect x="338" y="342" width="22" height="20" rx="2" fill="url(#bar2)" opacity="0.4"/>
  <!-- Baseline line -->
  <line x1="40" y1="342" x2="370" y2="342" stroke="url(#line)" stroke-width="1.5" opacity="0.5"/>
</svg>
