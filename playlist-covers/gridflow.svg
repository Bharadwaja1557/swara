<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#0c0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8a6d3e"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0f2348"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Grid — fine lines -->
  <g stroke="#ffffff" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="50"  x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50"  y1="0" x2="50"  y2="400"/><line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>
  <!-- Feature blocks — offset grid composition -->
  <!-- Large accent block -->
  <rect x="50" y="50" width="150" height="150" rx="6" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
  <!-- Cool blue block -->
  <rect x="220" y="50" width="130" height="80" rx="6" fill="url(#cool)" opacity="0.85"/>
  <!-- Small accent block -->
  <rect x="220" y="150" width="60" height="50" rx="4" fill="url(#accent)" opacity="0.6"/>
  <!-- Mid row -->
  <rect x="50" y="220" width="80" height="130" rx="6" fill="url(#cool)" opacity="0.7"/>
  <rect x="150" y="220" width="200" height="60" rx="6" fill="url(#accent)" opacity="0.5"/>
  <rect x="150" y="300" width="95" height="50" rx="4" fill="url(#cool)" opacity="0.55"/>
  <rect x="260" y="220" width="90" height="130" rx="6" fill="url(#accent)" opacity="0.35"/>
  <!-- Bright corner accent -->
  <rect x="300" y="148" width="52" height="52" rx="4" fill="#c8a96e" opacity="0.22"/>
  <!-- Fine inner lines on large block — UI feel -->
  <line x1="60" y1="120" x2="190" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="60" y1="148" x2="190" y2="148" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="100" y1="60" x2="100" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>
